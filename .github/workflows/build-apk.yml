name: Build APK

on:
  push:
    branches: [main, 'wip/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo holds only lib/, pubspec and the Android files we changed;
      # generate the rest of the Flutter scaffold, then overlay our files.
      - name: Create scaffold and overlay sources
        run: |
          flutter create --org com.ezzat --platforms android obd_saga
          cp -r src/lib src/test src/assets src/pubspec.yaml obd_saga/
          cp src/android/app/src/main/AndroidManifest.xml obd_saga/android/app/src/main/
          mkdir -p obd_saga/android/app/src/main/kotlin/com/ezzat/obd_saga
          cp src/android/app/src/main/kotlin/com/ezzat/obd_saga/MainActivity.kt \
             obd_saga/android/app/src/main/kotlin/com/ezzat/obd_saga/

      - name: Get packages
        working-directory: obd_saga
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: obd_saga
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: obd_saga
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: obd_saga
        run: flutter test

      - name: Build APK
        working-directory: obd_saga
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: saga-obd-apk
          path: obd_saga/build/app/outputs/flutter-apk/app-release.apk

      # Every build on main becomes the "latest" release, so the APK has a
      # stable download link: /releases/latest
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: cp obd_saga/build/app/outputs/flutter-apk/app-release.apk car-obd.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Car OBD build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: car-obd.apk
          make_latest: true
