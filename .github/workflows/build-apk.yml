name: Build APK

on:
  push:
    branches: [main, 'wip/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo holds only lib/, pubspec and the Android files we changed;
      # generate the rest of the Flutter scaffold, then overlay our files.
      - name: Create scaffold and overlay sources
        run: |
          flutter create --org com.ezzat --platforms android obd_saga
          cp -r src/lib src/test src/assets src/pubspec.yaml obd_saga/
          cp src/android/app/src/main/AndroidManifest.xml obd_saga/android/app/src/main/
          # Our Kotlin + the AA Bridge engine (dev/caraalink, GPL-3.0).
          rm -rf obd_saga/android/app/src/main/kotlin
          cp -r src/android/app/src/main/kotlin obd_saga/android/app/src/main/
          cp -r src/android/app/src/main/res/. obd_saga/android/app/src/main/res/
          mkdir -p obd_saga/android/app/src/main/assets
          cp -r src/android/app/src/main/assets/. obd_saga/android/app/src/main/assets/
          G=obd_saga/android/app/build.gradle.kts
          # The car-screen engine needs Android 10+.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 29/' $G
          grep -q 'minSdk = 29' $G
          printf '\ndependencies {\n    implementation("androidx.car.app:app:1.4.0")\n    implementation("androidx.preference:preference-ktx:1.2.1")\n}\n' >> $G

      # Same signing key on every build, so updates install over the
      # previous version instead of failing with "App not installed".
      - name: Use the app's fixed signing key
        run: |
          mkdir -p ~/.android
          cp src/android/signing/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        working-directory: obd_saga
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: obd_saga
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: obd_saga
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: obd_saga
        run: flutter test

      - name: Build APK
        working-directory: obd_saga
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}  # arm64 only: ~3x smaller download

      # Play Store needs an Android App Bundle, signed with the same
      # (upload) key; Google re-signs it for delivery.
      - name: Build App Bundle for Google Play
        working-directory: obd_saga
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }}
          grep -o 'targetSdk[^,]*' build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml || true

      - uses: actions/upload-artifact@v4
        with:
          name: saga-obd-apk
          path: obd_saga/build/app/outputs/flutter-apk/app-release.apk

      # Every build on main becomes the "latest" release, so the APK has a
      # stable download link: /releases/latest
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          cp obd_saga/build/app/outputs/flutter-apk/app-release.apk car-obd.apk
          cp obd_saga/build/app/outputs/bundle/release/app-release.aab car-obd.aab

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Car OBD build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            car-obd.apk
            car-obd.aab
          make_latest: true
