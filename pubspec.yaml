name: obd_saga
description: OBD2 dashboard + trip logger for ELM327 (Proton Saga).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.0
  path: ^1.9.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.4.0
  geolocator: ^13.0.1
  wakelock_plus: ^1.2.8
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  share_plus: ^11.0.0
  file_picker: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
